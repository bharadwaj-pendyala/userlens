[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "userlens"
version = "0.1.0"
description = "Check that a CLI or web UI works the way users use it, then that it is good to use. Built for coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bharadwaj Pendyala" }]
keywords = ["testing", "acceptance", "e2e", "ux", "cli", "agents", "playwright", "snapshot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/bharadwaj-pendyala/userlens"
Repository = "https://github.com/bharadwaj-pendyala/userlens"
Issues = "https://github.com/bharadwaj-pendyala/userlens/issues"

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=7"]

[project.scripts]
eyes = "userlens.cli:main"
userlens = "userlens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/userlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
